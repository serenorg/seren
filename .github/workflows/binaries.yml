name: Build Binaries

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
          - os: macos-13
            target: x86_64-apple-darwin
            builder: cargo
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (release)
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build \
              --release \
              --locked \
              --target "${{ matrix.target }}" \
              -p seren-cli
          else
            cargo build \
              --release \
              --locked \
              --target "${{ matrix.target }}" \
              -p seren-cli
          fi

      - name: Prepare archive (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail

          out="dist/seren-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$out"

          cp LICENSE "$out/"

          cp "target/${{ matrix.target }}/release/seren" "$out/"

          archive="dist/seren-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C dist "$(basename "$out")"

          (
            cd dist
            base="$(basename "$archive")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$base" > "${base}.sha256"
            else
              shasum -a 256 "$base" > "${base}.sha256"
            fi
          )

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $out = "dist/seren-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item "LICENSE" $out
          Copy-Item "target/${{ matrix.target }}/release/seren.exe" $out

          $archive = "dist/seren-${{ github.ref_name }}-${{ matrix.target }}.zip"
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Compress-Archive -Path "$out/*" -DestinationPath $archive

          $hash = Get-FileHash -Algorithm SHA256 -Path $archive
          "$($hash.Hash)  $(Split-Path -Leaf $archive)" | Out-File -Encoding ascii -NoNewline "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seren-${{ matrix.target }}
          path: |
            dist/seren-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete existing assets (reruns)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets -q '.assets[].name')"
            for f in dist/*; do
              name="$(basename "$f")"
              if echo "$existing" | grep -Fxq "$name"; then
                gh release delete-asset "$tag" "$name" -y
              fi
            done
          fi

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
