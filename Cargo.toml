[package]
name = "seren-cli"
version = "0.1.0"
edition = "2021"
authors = ["Seren Team"]
license = "MIT"
description = "CLI tool for Seren database management"
repository = "https://github.com/seren/seren-cli"

[[bin]]
name = "seren"
path = "src/main.rs"

[dependencies]
# Seren SDK (standalone crate)
seren = { path = "../seren-api" }
# Note: When published to crates.io, use:
# seren = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow = "1"

# Config and paths
dirs = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal output
comfy-table = "7"
colored = "2"
