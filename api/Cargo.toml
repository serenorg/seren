[package]
name = "seren"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust SDK for the Seren API - Programmatic access to Seren database management"
repository = "https://github.com/seren/seren"
keywords = ["seren", "database", "sdk", "api"]
categories = ["api-bindings", "database"]
readme = "README.md"

[lib]
# The SDK is largely generated from OpenAPI. The generated docs currently contain
# doctest blocks that reference internal server crates and fail to compile.
doctest = false

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base62 = { workspace = true }
futures = { workspace = true }
progenitor-client = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
regress = { workspace = true }
schemars = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
progenitor = { workspace = true }
prettyplease = { workspace = true }
syn = { workspace = true }
serde_json = { workspace = true }
openapiv3 = { workspace = true }
