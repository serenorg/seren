[package]
name = "seren-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP server for SerenDB - AI assistant integration"
repository = "https://github.com/seren/seren"
keywords = ["seren", "mcp", "ai", "database"]

[[bin]]
name = "seren-mcp"
path = "src/main.rs"

[features]
default = []
# Enable OpenTelemetry for production/hosted deployments
telemetry = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
]

[dependencies]
# Workspace - shared API client
seren = { path = "../api" }
jiff = { workspace = true }

# MCP SDK
rmcp = { workspace = true }
schemars = { workspace = true }
tokio-util = { workspace = true }

# Web server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Database (token storage)
sqlx = { workspace = true }

# Auth
oauth2 = { workspace = true }
argon2 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# HTTP client (for SQL proxy)
reqwest = { workspace = true }

# Logging & Telemetry
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# OpenTelemetry (optional - for hosted/production deployments)
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }

# Ethereum wallet
alloy = { workspace = true }
hex = { workspace = true }

# Config
toml = { workspace = true }
etcetera = { workspace = true }

# Utils
uuid = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
html-escape = { workspace = true }
tower_governor = { workspace = true }
lru = "0.16.2"

[dev-dependencies]
temp-env = { version = "0.3", features = ["async_closure"] }
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
wiremock = "0.6"
