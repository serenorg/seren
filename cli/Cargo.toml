[package]
name = "seren-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool for Seren database management"
repository = "https://github.com/seren/seren-cli"

[[bin]]
name = "seren"
path = "src/main.rs"

[dependencies]
seren = { path = "../api" }
seren-agent = { path = "../../seren-core/seren-agent" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comfy-table = { workspace = true }
colored = { workspace = true }
futures-util = "0.3"
jiff = { workspace = true }
uuid = { workspace = true }
rpassword = "7.3"
reqwest = { workspace = true, features = ["stream"] }
oauth2 = { workspace = true }
url = "2.5"
open = "5.0"
etcetera = "0.11.0"
urlencoding = { workspace = true }
