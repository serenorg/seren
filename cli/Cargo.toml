[package]
name = "seren-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "seren"
description = "CLI tool for Seren database management"
repository = "https://github.com/seren/seren-cli"

[lib]
name = "seren_cli"
path = "src/lib.rs"

[[bin]]
name = "seren"
path = "src/main.rs"

[features]
default = []
telemetry = ["seren-mcp/telemetry"]

[dependencies]
seren = { path = "../api" }
seren-mcp = { path = "../mcp" }
seren-secrets-crypto = { git = "https://github.com/serenorg/seren-secrets.git", tag = "v0.2.0" }
seren-secrets-resolver = { git = "https://github.com/serenorg/seren-secrets.git", tag = "v0.2.0" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comfy-table = { workspace = true }
colored = { workspace = true }
futures-util = "0.3"
jiff = { workspace = true }
uuid = { workspace = true }
rpassword = "7.4"
reqwest = { workspace = true, features = ["stream"] }
oauth2 = { workspace = true }
url = "2.5"
open = "5.3"
etcetera = "0.11.0"
urlencoding = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
zeroize = "1"
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
