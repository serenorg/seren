[package]
name = "seren-cli"
version = "0.1.0"
edition = "2021"
authors = ["Seren Team"]
license = "MIT"
description = "CLI tool for Seren database management"
repository = "https://github.com/seren/seren-cli"

[[bin]]
name = "seren"
path = "src/main.rs"

[dependencies]
seren = { path = "../api" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
comfy-table = { workspace = true }
colored = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
rpassword = "7.3"
reqwest = { version = "0.11", features = ["json"] }
oauth2 = "4.4"
url = "2.5"
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
open = "5.0"
