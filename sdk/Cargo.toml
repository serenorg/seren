[package]
name = "seren-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Rust SDK for the Seren API"
repository = "https://github.com/serenorg/seren"
keywords = ["seren", "database", "agents", "sdk", "api"]
categories = ["api-bindings", "database"]
readme = "README.md"
include = ["build.rs", "src/*.rs", "examples/**", "README.md", "LICENSE", "openapi/*.json"]

[lib]
name = "seren"
# The SDK is largely generated from OpenAPI. The generated docs currently contain
# doctest blocks that reference internal server crates and fail to compile.
doctest = false

[dependencies]
reqwest = { workspace = true, default-features = false, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
base62 = { workspace = true }
futures = { workspace = true }
progenitor-client = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true, features = ["js"] }
regress = { workspace = true }
schemars = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
progenitor = { workspace = true }
prettyplease = { workspace = true }
syn = { workspace = true }
serde_json = { workspace = true }
openapiv3 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
